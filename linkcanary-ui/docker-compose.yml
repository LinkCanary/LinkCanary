# Full stack: Caddy + Auth + API + Worker + Beat + Postgres + Redis
# Bring up with: docker compose up --build
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - auth
    restart: unless-stopped

  auth:
    build: ./auth-service
    env_file: .env
    environment:
      PORT: 3001
      API_URL: http://api:3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkcanary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkcanary}
      POSTGRES_DB: ${POSTGRES_DB:-linkcanary}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkcanary}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn linkcanary_ui.main:app --host 0.0.0.0 --port 3000"
    volumes:
      - reportdata:/root/.linkcanary
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: celery -A linkcanary_ui.tasks.celery_app:celery_app worker --loglevel=info
    volumes:
      - reportdata:/root/.linkcanary
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    command: celery -A linkcanary_ui.tasks.celery_app:celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  reportdata:
  caddy_data:
